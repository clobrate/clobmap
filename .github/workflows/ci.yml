name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run JavaScript actions (checkout, setup-node, etc.) on Node 24
  # instead of the default Node 20 that's being removed in Sept 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Lint · Typecheck · Test · Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm run test

      - name: Coverage gate
        run: npm run test:coverage

      - name: Web build
        run: npm run build:web

  cli-binary:
    name: CLI binary (build + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compile the standalone Node-SEA binary (host == linux-x64 here) and run
      # the process-e2e against IT — verifies --version parity, the embedded
      # SKILL.md asset, and stdout/stderr/exit behavior of the shipped executable.
      - name: Build standalone CLI
        run: npm run build:cli

      - name: Compiled-binary e2e
        run: CLOBMAP_BIN="$PWD/dist-cli/clobmap" npx vitest run skills/clobmap/__tests__/cli-process.e2e.test.ts

  rust:
    name: Rust (test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Compiles the Rust (compile-checking every PR, which release.yml did but
      # PR CI didn't) and runs the cli_tool unit tests.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: Playwright (web E2E)
    needs: test
    runs-on: ubuntu-latest
    # The Playwright browser-install step takes ~5-7 minutes on a cache
    # miss (chromium + firefox + webkit). Combined with the full test
    # suite that pushed total wall-time past the 15-minute cap when
    # package-lock churned the cache key. The cache isn't saved on
    # cancellation, so every retry hit the same cold start. 25 minutes
    # lets the first cold-cache run save the cache; subsequent cached
    # runs finish well under 10 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright tests
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
